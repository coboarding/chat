[build-system]
requires = ["setuptools>=42", "wheel", "setuptools_scm[toml]>=3.4"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "pydantic.*",
    "sqlalchemy.*",
    "alembic.*",
    "uvicorn.*",
    "fastapi.*"
]
disallow_untyped_defs = false

[project]
name = "coboarding"
version = "0.1.0"
description = "AI-Powered Job Application Automation for SME Tech Companies in Europe"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
dependencies = [
    "streamlit>=1.67.0",
    "fastapi>=0.109.2",
    "uvicorn[standard]>=0.27.1",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.9",
    "alembic>=1.20.1",
    "psycopg2-binary>=2.9.13",
    "aiosqlite>=0.19.0",
    "ollama>=0.1.9",
    "spacy>=3.8.18",
    "transformers>=4.57.6",
    "torch>=2.15.0",
    "numpy>=1.26.4",
    "pandas>=2.3.3",
    "sentence-transformers>=2.7.0",
    "pypdf2>=3.0.1",
    "python-docx>=1.2.0",
    "pytesseract>=0.3.13",
    "pillow>=10.4.0",
    "pdf2image>=1.17.0",
    "weasyprint>=60.2",
    "markdown>=3.11.3",
    "playwright>=1.65.2",
    "selenium>=4.53.0",
    "undetected-chromedriver>=3.5.5",
    "opencv-python-headless>=4.14.0.94",
    "easyocr>=1.7.2",
    "requests>=2.34.2",
    "python-telegram-bot>=20.8",
    "python-dotenv>=1.2.4",
    "loguru>=0.7.3",
    "tenacity>=8.5.0",
    "httpx>=0.27.2",
    "jinja2>=3.1.6",
    "cryptography>=42.0.8",
    "redis>=5.3.1",
    "asyncpg>=0.29.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.17.0",
    "pytest-xdist>=3.8.0",
    "black>=24.10.0",
    "isort>=5.13.2",
    "flake8>=7.5.0",
    "flake8-bugbear>=24.12.12",
    "flake8-comprehensions>=3.17.0",
    "mypy>=1.20.2",
    "pre-commit>=3.8.0",
    "watchfiles>=0.21.0",
    "ipython>=8.39.0",
    "ipdb>=0.13.13",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.8.2",
    "mkdocstrings[python]>=0.24.3",
    "types-requests>=2.33.0.20261030",
    "types-python-dateutil>=2.9.0.20261116",
    "types-pyyaml>=6.0.12.20261113"
]

[tool.black]
line-length = 88
target-version = ["py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=app --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["app"]
omit = ["app/tests/*", "app/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise ImportError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"
title = "coBoarding Test Coverage"

[tool.coverage.xml]
output = "coverage.xml"
